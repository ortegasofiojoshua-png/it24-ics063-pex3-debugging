<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter</title>
    <link rel="stylesheet" href="style.css">
   <script src="script.js" defer></script> 
</head>
<body>
    <div class="container">
        <h1>INSTITUTE FOR COMPUTER STUDIES</h1>
        <h2>Debug the Click Counter</h2>

        <p>Click the button and observe the displayed counter.
            Use the browser CONSOLE to investigate the issue.
        </p>
        
        <div class="counter-box">
            <h3>Current Count</h3>
            <span id="countOutput">0</span>
        </div>

        <div class="buttons">
            <button id="countBtn">Click Me</button>
            <button id="resetBtn">Reset</button>
        </div>

        <p id="statusMessage">Ready to start.</p>
    </div>
</body>
</html>
